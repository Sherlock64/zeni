<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Factory board</title>
<style>
:root {
  --bg: #f6f6f4; --panel: #ffffff; --ink: #1b1b1a; --muted: #66655f; --line: #deddd8;
  --accent: #2f6fdf; --warn: #b4540a; --warn-bg: #fff3e6; --ok: #1f7a4a; --track: #ebeae6;
  --e0: #2f6fdf; --e1: #8a4fd8; --e2: #1f8a7a; --e3: #c2410c;
  --l-green: #1f9a55; --l-yellow: #d9a300; --l-red: #d33b32; --l-off: #8a8984;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141414; --panel: #1e1e1d; --ink: #ececea; --muted: #a3a29c; --line: #34332f;
    --accent: #6c9cf5; --warn: #f2a65a; --warn-bg: #3a2a18; --ok: #5cc28b; --track: #2c2b28;
    --e0: #6c9cf5; --e1: #b48af0; --e2: #4fc2b0; --e3: #f08a5d;
    --l-green: #3ccf7f; --l-yellow: #f3c53a; --l-red: #f0625a; --l-off: #6f6e69;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, sans-serif; }
main { padding: 16px; display: grid; gap: 14px; max-width: 1600px; margin: 0 auto; }
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px; }
h1 { font-size: 1.25rem; margin: 0; }
h2 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 0 0 8px; }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; }
.strip { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.meter { margin-bottom: 10px; }
.meter:last-child { margin-bottom: 0; }
.meter .row { display: flex; justify-content: space-between; gap: 8px; }
.bar { height: 8px; background: var(--track); border-radius: 4px; overflow: hidden; margin-top: 4px; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 4px; transition: width .5s; }
.bar.hot > i { background: var(--warn); }
.lightrow { display: flex; align-items: center; gap: 14px; margin-bottom: 8px; }
.lamp { flex: none; width: 56px; height: 56px; border-radius: 50%; background: var(--lamp); box-shadow: 0 0 18px 2px color-mix(in srgb, var(--lamp) 55%, transparent); transition: background .4s, box-shadow .4s; }
.lamp.off { box-shadow: none; }
.lamp.stale { outline: 3px dashed var(--ink); outline-offset: 3px; }
.lword { font-size: 1.6rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
.countdown { font-size: 1.3rem; font-weight: 700; margin-top: 4px; }
.small { font-size: 0.8rem; }
.stalenote { color: var(--warn); font-weight: 600; }
.nh { border-color: var(--warn); background: var(--warn-bg); }
#nh, .tokens ol, .retros ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.nh li { display: grid; gap: 2px; }
.session { font-family: ui-monospace, monospace; font-weight: 600; }
.board-wrap { overflow-x: auto; }
.board { display: grid; grid-template-columns: repeat(9, minmax(150px, 1fr)); gap: 8px; min-width: 1400px; }
.col { background: var(--track); border-radius: 8px; padding: 8px; min-height: 220px; }
.col h2 { display: flex; justify-content: space-between; }
.col.nhcol { background: var(--warn-bg); }
.cards { display: grid; gap: 6px; align-content: start; }
.card { position: relative; background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--epic, var(--line)); border-radius: 6px; padding: 6px 8px; }
.card.epic { font-weight: 600; }
.card .meta { display: flex; gap: 6px; font-size: 0.75rem; color: var(--muted); }
.card .kind { text-transform: uppercase; letter-spacing: .04em; }
.card .run { font-family: ui-monospace, monospace; font-size: 0.72rem; color: var(--accent); overflow-wrap: anywhere; }
.card.moved { box-shadow: 0 0 0 2px var(--accent); }
.bottom { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
.tokens li { display: grid; grid-template-columns: 1.5em 1fr auto; gap: 4px 8px; align-items: center; background: var(--panel); position: relative; }
.tokens li .bar { grid-column: 2 / 4; margin: 0; height: 5px; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.dot.live { background: var(--ok); }
a { color: var(--accent); }
@media (prefers-reduced-motion: reduce) { .bar > i { transition: none; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>Zeni factory</h1>
    <span class="muted"><span id="dot" class="dot"></span> <span id="conn">connecting</span></span>
    <span class="muted">Total tokens: <strong id="total" class="num">0</strong></span>
    <span class="muted" id="frun"></span>
    <strong id="ghnote" role="status"></strong>
  </header>

  <section class="strip">
    <div class="panel" aria-labelledby="h-light">
      <h2 id="h-light">Traffic light</h2>
      <div class="lightrow">
        <span id="lamp" class="lamp" aria-hidden="true"></span>
        <div><div id="lword" class="lword" role="status">–</div><div id="lreason"></div></div>
      </div>
      <div id="lmeaning" class="muted"></div>
      <div id="lcount" class="num countdown"></div>
      <div id="lage" class="small muted"></div>
      <div id="lslots" class="small muted"></div>
    </div>
    <div class="panel" aria-labelledby="h-usage">
      <h2 id="h-usage">Usage windows</h2>
      <div class="meter"><div class="row"><span>5-hour</span><span class="num" id="u5">–</span></div><div class="bar" id="u5bar"><i style="width:0"></i></div></div>
      <div class="meter"><div class="row"><span>Weekly</span><span class="num" id="uw">–</span></div><div class="bar" id="uwbar"><i style="width:0"></i></div></div>
    </div>
    <div class="panel" aria-labelledby="h-epics">
      <h2 id="h-epics">Epics</h2>
      <div id="epics"></div>
    </div>
  </section>

  <section class="panel" id="nhpanel" aria-labelledby="h-nh">
    <h2 id="h-nh">Needs you</h2>
    <ul id="nh" aria-live="polite"></ul>
  </section>

  <section class="board-wrap" aria-label="Spine board"><div class="board" id="board"></div></section>

  <section class="bottom">
    <div class="panel tokens" aria-labelledby="h-tok">
      <h2 id="h-tok">Top 10 token users</h2>
      <ol id="tok"></ol>
    </div>
    <div class="panel retros" aria-labelledby="h-retro">
      <h2 id="h-retro">Last factory run</h2>
      <div id="retros" class="muted">No run has ended yet.</div>
    </div>
  </section>
</main>
<script>
const STATES = ["intake", "shaping", "ready", "building", "verifying", "reviewing", "merged", "released", "needs-human"];
const LABEL = { "needs-human": "needs human" };
const ACTIVE = ["building", "verifying", "reviewing", "needs-human"]; // states that hold a run slot
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const fmt = (n) => n.toLocaleString("en-US");
const reduced = matchMedia("(prefers-reduced-motion: reduce)");

// Columns, built once; cards move between them.
const cols = {};
for (const s of STATES) {
  const c = el("div", "col" + (s === "needs-human" ? " nhcol" : ""));
  const h = el("h2"); h.append(el("span", null, LABEL[s] ?? s), el("span", "num", "0"));
  const list = el("div", "cards");
  c.append(h, list);
  $("board").append(c);
  cols[s] = { count: h.lastChild, list };
}

// FLIP: measure, change the DOM, then play each moved element from its old place.
function flip(elements, mutate) {
  const before = new Map([...elements()].map((e) => [e, e.getBoundingClientRect()]));
  mutate();
  if (reduced.matches || document.hidden) return; // a hidden tab would queue frozen animations
  for (const e of elements()) {
    const b = before.get(e);
    if (!b) { e.animate([{ opacity: 0, transform: "scale(.92)" }, { opacity: 1, transform: "none" }], { duration: 350 }); continue; }
    const a = e.getBoundingClientRect();
    const dx = b.left - a.left, dy = b.top - a.top;
    if (Math.abs(dx) < 1 && Math.abs(dy) < 1) continue;
    e.style.zIndex = 5;
    e.animate([{ transform: `translate(${dx}px, ${dy}px)` }, { transform: "none" }], { duration: Math.abs(dx) > 1 ? 700 : 400, easing: "cubic-bezier(.2,.8,.2,1)" })
      .finished.then(() => (e.style.zIndex = ""), () => {});
  }
}

const cards = new Map();
function renderBoard(snap) {
  const epicColor = Object.fromEntries(snap.epics.map((e, i) => [e.id, `var(--e${i % 4})`]));
  // Epics first, then by number.
  const items = snap.items.slice().sort((a, b) => (b.kind === "epic") - (a.kind === "epic") || (a.number ?? 0) - (b.number ?? 0));
  flip(() => document.querySelectorAll(".card"), () => {
    const seen = new Set();
    for (const it of items) {
      seen.add(it.id);
      let c = cards.get(it.id);
      if (!c) { c = el("article", "card"); cards.set(it.id, c); }
      const moved = c.dataset.state && c.dataset.state !== it.state;
      c.dataset.state = it.state;
      c.className = "card" + (it.kind === "epic" ? " epic" : "") + (moved ? " moved" : "");
      if (moved) setTimeout(() => c.classList.remove("moved"), 1500);
      c.style.setProperty("--epic", epicColor[it.epic ?? it.id] ?? "var(--line)");
      const meta = el("div", "meta");
      meta.append(el("span", "kind", it.kind), el("span", "num", it.number != null ? `#${it.number}` : ""));
      const parts = [meta, el("div", null, it.title)];
      if (it.session && it.kind === "ticket" && ACTIVE.includes(it.state)) parts.push(el("div", "run", it.session));
      c.replaceChildren(...parts);
      cols[it.state].list.append(c); // append moves an existing node
    }
    for (const [id, c] of cards) if (!seen.has(id)) { c.remove(); cards.delete(id); }
    for (const s of STATES) cols[s].count.textContent = cols[s].list.children.length;
  });
}

const rows = new Map();
function renderTokens(snap) {
  const max = Math.max(1, ...snap.topRuns.map((r) => r.tokens));
  flip(() => $("tok").children, () => {
    const keep = new Set(snap.topRuns.map((r) => r.run));
    for (const [id, r] of rows) if (!keep.has(id)) { r.remove(); rows.delete(id); }
    const ordered = snap.topRuns.map((r, i) => {
      let li = rows.get(r.run);
      if (!li) { li = el("li"); rows.set(r.run, li); }
      const bar = el("div", "bar"); const fill = el("i"); fill.style.width = `${(100 * r.tokens) / max}%`; bar.append(fill);
      li.replaceChildren(el("span", "muted num", `${i + 1}`), el("span", "session", r.session), el("span", "num", fmt(r.tokens)), bar);
      return li;
    });
    $("tok").replaceChildren(...(ordered.length ? ordered : [el("li", "muted", "No runs yet.")]));
  });
}

const MEANING = {
  green: "New runs may start.",
  yellow: "Nothing new starts; each run finishes its station or checkpoints.",
  red: "Everything checkpoints and stops.",
  off: "Stopped until you run the start skill.",
};
const STALE_MS = 45 * 60 * 1000; // fail safe: an older light counts as yellow
const setText = (id, t) => { if ($(id).textContent !== t) $(id).textContent = t; };
const dur = (ms) => {
  const s = Math.max(0, Math.round(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), r = String(s % 60).padStart(2, "0");
  return h ? `${h}:${String(m).padStart(2, "0")}:${r}` : `${m}:${r}`;
};
let light = null;
// Redrawn every second as well as on each event: a light goes stale with no event at all.
function drawLight() {
  if (!light) { setText("lword", "no light"); setText("lmeaning", "The watchdog has not written a light yet."); return; }
  const age = Date.now() - Date.parse(light.set_at);
  const stale = !(age <= STALE_MS); // a bad set_at counts as stale too
  const word = stale ? "yellow" : light.light;
  $("lamp").style.setProperty("--lamp", `var(--l-${word})`);
  $("lamp").className = "lamp" + (word === "off" ? " off" : "") + (stale ? " stale" : "");
  setText("lword", stale ? "yellow (stale)" : word);
  setText("lreason", stale ? `Last light: ${light.light}, ${light.reason}` : light.reason);
  setText("lmeaning", MEANING[word]);
  const showCount = (word === "red" || word === "off") && light.resume_at;
  setText("lcount", showCount ? `resumes in ${dur(Date.parse(light.resume_at) - Date.now())}` : "");
  $("lcount").title = showCount ? `at ${new Date(light.resume_at).toLocaleTimeString()}` : "";
  setText("lage", stale ? `Not updated for ${Math.floor(age / 60000)} min: the watchdog may be down, so it counts as yellow.` : `Set ${dur(age)} ago`);
  $("lage").className = stale ? "small stalenote" : "small muted";
}
setInterval(drawLight, 1000);

function meter(id, w) {
  $(id).textContent = w ? `${w.pct}%` : "–";
  $(id + "bar").firstChild.style.width = `${w?.pct ?? 0}%`;
  $(id + "bar").classList.toggle("hot", (w?.pct ?? 0) >= 80);
}

function safeHref(h) {
  try { return ["http:", "https:"].includes(new URL(h, location.href).protocol) ? h : null; } catch { return null; }
}

function render(snap) {
  $("total").textContent = fmt(snap.totalTokens);
  $("ghnote").textContent = snap.github?.ok === false ? `GitHub unavailable (${snap.github.error}); showing the last state` : "";
  $("frun").textContent = snap.factoryRun ? `Factory run ${snap.factoryRun.id} in progress` : "";
  meter("u5", snap.light?.five_hour);
  meter("uw", snap.light?.weekly);
  light = snap.light;
  drawLight();
  const running = snap.items.filter((i) => i.kind === "ticket" && ACTIVE.includes(i.state)).length;
  setText("lslots", light ? `${running} of ${light.slots} run slots in use (weekly pace ${light.pace.toFixed(2)})` + (snap.sessions.some((x) => x.running) ? ` · sessions: ${snap.sessions.filter((x) => x.running).map((x) => x.context_pct == null ? x.name : `${x.name} ${x.context_pct}%`).join(", ")}` : !snap.sessions.length && light.sessions.length ? ` · sessions: ${light.sessions.join(", ")}` : "") : "");
  $("epics").replaceChildren(...snap.epics.map((e, i) => {
    const m = el("div", "meter");
    const row = el("div", "row"); row.append(el("span", null, e.title), el("span", "num muted", `${e.done} / ${e.total} merged`));
    const bar = el("div", "bar"); const fill = el("i"); fill.style.width = `${e.total ? (100 * e.done) / e.total : 0}%`; fill.style.background = `var(--e${i % 4})`; bar.append(fill);
    m.append(row, bar); return m;
  }));
  $("nhpanel").classList.toggle("nh", snap.needsHuman.length > 0);
  $("nh").replaceChildren(...(snap.needsHuman.length ? snap.needsHuman.map((n) => {
    const li = el("li");
    const who = el("div"); who.append("Open session ", el("span", "session", n.session), " in the Claude app");
    li.append(who, el("div", null, n.question));
    const href = safeHref(n.href);
    if (href) { const a = el("a", null, "Latest comment"); a.href = href; li.append(a); }
    return li;
  }) : [el("li", "muted", "Nothing needs you.")]));
  const r = snap.lastEndedRun;
  if (r) {
    const box = el("div");
    box.append(el("div", null, `Run ${r.id} ended ${new Date(r.ended_at).toLocaleTimeString()}`));
    const ul = el("ul");
    for (const x of r.retros) {
      const li = el("li"); const href = safeHref(x.href);
      if (href) { const a = el("a", null, x.title); a.href = href; li.append(a); } else li.append(x.title);
      ul.append(li);
    }
    if (!r.retros.length) ul.append(el("li", "muted", "No retros."));
    box.append(ul);
    $("retros").replaceChildren(box);
    $("retros").className = "";
  } else { $("retros").textContent = "No run has ended yet."; $("retros").className = "muted"; }
  renderBoard(snap);
  renderTokens(snap);
}

const es = new EventSource("/api/stream");
es.onmessage = (m) => render(JSON.parse(m.data));
es.onopen = () => { $("conn").textContent = "live"; $("dot").classList.add("live"); };
es.onerror = () => { $("conn").textContent = "reconnecting"; $("dot").classList.remove("live"); };
</script>
</body>
</html>
