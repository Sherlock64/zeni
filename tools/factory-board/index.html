<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Factory board</title>
<style>
/* The design picked in #142 (directions/chosen.html), desktop only. Colour is kept for the light, needs-human and failures. */
:root {
  --bg: #f5f5f3; --panel: #ffffff; --ink: #1c1c1a; --muted: #605f59; --line: #dcdbd6; --track: #ebeae6; --sub: #f0efeb;
  --link: #2858b8; --focus: #2858b8;
  --warn: #9a4a07; --warn-bg: #fff1e0; --warn-line: #c27a36;
  --g3: #6f6e68;
  color-scheme: light;
}
[data-theme="dark"] {
  --bg: #131312; --panel: #1d1d1b; --ink: #ecebe7; --muted: #a6a59e; --line: #34332f; --track: #2a2926; --sub: #232321;
  --link: #8fb1f5; --focus: #8fb1f5;
  --warn: #f4b072; --warn-bg: #3a2914; --warn-line: #b8743a;
  --g3: #95948d;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; min-width: 1200px; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, sans-serif; }
a { color: var(--link); }
a:focus-visible, button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
h1 { font-size: 1.15rem; margin: 0; }
h2 { font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px; font-weight: 600; }
.muted { color: var(--muted); }
.small { font-size: .8rem; }
.num { font-variant-numeric: tabular-nums; }
.session { font-family: ui-monospace, monospace; font-size: .8rem; overflow-wrap: anywhere; }
.meter .row { display: flex; justify-content: space-between; gap: 8px; }
.bar { height: 6px; background: var(--track); border-radius: 3px; overflow: hidden; margin-top: 3px; }
.bar > i { display: block; height: 100%; background: var(--g3); border-radius: 3px; transition: width .5s; }

/* status band: the dark theme's panel grey in every state and theme; only the lamp and the word carry the light's colour */
.band { --band-bg: #1d1d1b; --band-ink: #ecebe7; --band-muted: #a6a59e;
  --l-green: #5fd08f; --l-yellow: #f2c84b; --l-red: #f27a72; --l-off: #a6a59e;
  background: var(--band-bg); border-bottom: 1px solid #34332f; color: var(--band-ink); --muted: var(--band-muted); --track: #2a2926; --g3: #95948d; }
.band.lw-green { --lc: var(--l-green); } .band.lw-yellow { --lc: var(--l-yellow); }
.band.lw-red { --lc: var(--l-red); } .band.lw-off { --lc: var(--l-off); }
.band-in { max-width: 1700px; margin: 0 auto; padding: 14px 24px; display: grid; grid-template-columns: auto 1fr auto; gap: 12px 28px; align-items: center; }
.word { display: flex; align-items: center; gap: 10px; }
.lamp { display: inline-block; width: 22px; height: 22px; border-radius: 50%; background: var(--lc); flex: none; transition: background .4s; }
.lamp.stale { background: transparent; border: 3px dashed var(--lc); }
.word strong { font-size: 1.7rem; text-transform: uppercase; letter-spacing: .04em; color: var(--lc); }
.why { display: grid; gap: 2px; }
.meters { display: grid; grid-template-columns: 200px 200px; gap: 16px; }

.top { max-width: 1700px; margin: 0 auto; padding: 12px 24px 0; display: flex; gap: 18px; align-items: center; }
.top .switch { margin-left: auto; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--warn); }
.dot.live { background: var(--g3); }
.ghnote { color: var(--warn); font-weight: 600; }
.switch { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.switch button { font: inherit; font-size: .85rem; border: 0; background: var(--panel); color: var(--ink); padding: 4px 12px; cursor: pointer; }
.switch button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
main { max-width: 1700px; margin: 0 auto; padding: 14px 24px 28px; display: grid; gap: 16px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; }

/* board: always nine columns, in the spine's order */
.board { display: grid; grid-template-columns: var(--lanecol, ) repeat(9, minmax(0, 1fr)); gap: 0 8px; }
.board.lanes { --lanecol: 170px; gap: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.hcell { font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; display: flex; justify-content: space-between; padding: 8px; }
.hcell.nh { color: var(--warn); }
.kanban .hcell { background: var(--sub); border-radius: 8px 8px 0 0; }
.kanban .hcell.nh, .kanban .cell.nh { background: var(--warn-bg); }
.kanban .cell { background: var(--sub); border-radius: 0 0 8px 8px; min-height: 340px; }
.cell { padding: 8px; display: grid; gap: 6px; align-content: start; min-width: 0; }
.lanes .hcell, .lanes .lane-name { background: var(--sub); }
.lanes > * { border-bottom: 1px solid var(--line); }
.lanes .cell { border-left: 1px solid var(--line); min-height: 70px; }
.lanes .cell.nh { background: var(--warn-bg); }
.lane-name { padding: 8px 10px; }
.lane-name strong { display: block; }
.lane-name .bar { margin-top: 6px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font-size: .9rem; position: relative; }
.card.k-epic { font-weight: 600; }
.card .meta { display: flex; gap: 6px; font-size: .72rem; color: var(--muted); }
.card .kind { text-transform: uppercase; letter-spacing: .04em; }
.card.nhc { border-color: var(--warn-line); box-shadow: inset 3px 0 var(--warn-line); }
.card.moved { outline: 2px solid var(--ink); outline-offset: -1px; }
.card .q { margin-top: 4px; font-weight: 600; }
.card .q + .session { margin-top: 2px; }
.bottom { display: grid; grid-template-columns: 1fr 1.4fr 1fr; gap: 16px; align-items: stretch; }
.epics, .runs { display: grid; gap: 8px; }
.runs { list-style: none; margin: 0; padding: 0; }
.runs li { display: grid; grid-template-columns: 1.4em 1fr auto; gap: 2px 8px; }
.runs .bar { grid-column: 2 / -1; height: 4px; margin: 0; }
.lastrun p { margin: 0 0 6px; }
.lastrun ul { margin: 0; padding-left: 18px; }
@media (prefers-reduced-motion: reduce) { .bar > i, .lamp { transition: none; } }
</style>
</head>
<body>
<header class="band lw-off" id="band">
  <div class="band-in">
    <div class="word"><span id="lamp" class="lamp" aria-hidden="true"></span><strong id="lword" role="status">–</strong></div>
    <div class="why">
      <div><strong id="lreason"></strong><span id="lsep"></span><span id="lmeaning"></span> <strong id="lcount" class="num"></strong></div>
      <div class="small" id="lslots"></div>
      <div class="small muted"><span id="lage"></span> · <span id="total" class="num">0</span> weighted tokens<span id="frun"></span></div>
    </div>
    <div class="meters">
      <div class="meter"><div class="row"><span>5-hour</span><span class="num" id="u5">–</span></div><div class="bar" id="u5bar"><i style="width:0"></i></div></div>
      <div class="meter"><div class="row"><span>Weekly</span><span class="num" id="uw">–</span></div><div class="bar" id="uwbar"><i style="width:0"></i></div></div>
    </div>
  </div>
</header>
<div class="top">
  <h1>Zeni factory</h1>
  <span class="muted small"><span id="dot" class="dot"></span> <span id="conn">connecting</span></span>
  <span class="ghnote small" id="ghnote" role="status"></span>
  <span class="switch" role="group" aria-label="Board view">
    <button type="button" data-mode="kanban">Kanban</button><button type="button" data-mode="lanes">Lanes by epic</button>
  </span>
</div>
<main>
  <section aria-label="Spine board" id="boardwrap"></section>
  <div class="bottom">
    <section class="panel" aria-labelledby="h-epics"><h2 id="h-epics">Epics</h2><div class="epics" id="epics"></div></section>
    <section class="panel" aria-labelledby="h-tok"><h2 id="h-tok">Top 10 token users</h2><ol class="runs" id="tok"></ol></section>
    <section class="panel" aria-labelledby="h-run"><h2 id="h-run">Factory run</h2><div class="lastrun" id="retros"></div></section>
  </div>
</main>
<script type="module">
import { ACTIVE, MODE_KEY, boardModel, lightView, readMode, safeHref, slotsLine } from "/page.js";

// Theme: ?theme=light|dark, else the system's, following its changes.
const themeParam = new URLSearchParams(location.search).get("theme");
const dark = matchMedia("(prefers-color-scheme: dark)");
const setTheme = () => (document.documentElement.dataset.theme = themeParam ?? (dark.matches ? "dark" : "light"));
setTheme();
dark.addEventListener("change", setTheme);

const $ = (id) => document.getElementById(id);
function el(tag, cls, ...kids) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  for (const k of kids) if (k != null) e.append(k);
  return e;
}
const link = (text, href) => { const a = el("a", null, text); a.href = href; return a; };
const fmt = (n) => (n == null ? "unknown" : n.toLocaleString("en-US")); // null: the run's transcript is missing
const kfmt = (n) => (n == null ? "unknown" : n >= 1e6 ? `${(n / 1e6).toFixed(1)}M` : n >= 1e3 ? `${Math.round(n / 1e3)}k` : String(n));
const ago = (iso) => {
  const m = Math.max(0, Math.round((Date.now() - Date.parse(iso)) / 60e3)), d = Math.floor(m / 1440), h = Math.floor((m % 1440) / 60), r = m % 60;
  return d ? `${d} d ${h} h` : h ? `${h} h ${r} m` : `${r} m`;
};
const fill = (pct) => { const i = el("i"); i.style.width = `${pct}%`; return el("div", "bar", i); };
const setText = (id, t) => { if ($(id).textContent !== t) $(id).textContent = t; };
const reduced = matchMedia("(prefers-reduced-motion: reduce)");

let snap = null;
let mode = readMode(localStorage);
for (const b of document.querySelectorAll(".switch button")) {
  b.onclick = () => {
    mode = b.dataset.mode;
    try { localStorage.setItem(MODE_KEY, mode); } catch {}
    if (snap) renderBoard();
    pressed();
  };
}
const pressed = () => { for (const b of document.querySelectorAll(".switch button")) b.setAttribute("aria-pressed", String(b.dataset.mode === mode)); };
pressed();

// FLIP: measure, change the DOM, then play each moved element from its old place.
function flip(elements, mutate) {
  const before = new Map([...elements()].map((e) => [e, e.getBoundingClientRect()]));
  mutate();
  if (reduced.matches || document.hidden) return; // a hidden tab would queue frozen animations
  for (const e of elements()) {
    const b = before.get(e);
    if (!b) { e.animate([{ opacity: 0, transform: "scale(.92)" }, { opacity: 1, transform: "none" }], { duration: 350 }); continue; }
    const a = e.getBoundingClientRect();
    const dx = b.left - a.left, dy = b.top - a.top;
    if (Math.abs(dx) < 1 && Math.abs(dy) < 1) continue;
    e.style.zIndex = 5;
    e.animate([{ transform: `translate(${dx}px, ${dy}px)` }, { transform: "none" }], { duration: Math.abs(dx) > 1 ? 700 : 400, easing: "cubic-bezier(.2,.8,.2,1)" })
      .finished.then(() => (e.style.zIndex = ""), () => {});
  }
}

// One DOM node per card, kept across renders so it can fly to its new cell.
const cards = new Map();
function cardNode(it) {
  let c = cards.get(it.id);
  if (!c) { c = el("article"); cards.set(it.id, c); }
  const moved = c.dataset.state && c.dataset.state !== it.state;
  c.dataset.state = it.state;
  c.className = `card k-${it.kind}${it.state === "needs-human" ? " nhc" : ""}${moved ? " moved" : ""}`;
  if (moved) setTimeout(() => c.classList.remove("moved"), 1500);
  const parts = [el("div", "meta", el("span", "kind", it.kind), it.number != null ? el("span", "num", `#${it.number}`) : null), el("div", "t", it.title)];
  if (it.ask) {
    // The needs-human column is the only place a question shows.
    parts.push(el("div", "q", it.ask.question), el("div", "session muted", "open ", el("strong", null, it.ask.session)));
    if (it.ask.href) parts.push(link("Latest comment", it.ask.href));
  } else if (it.session && it.kind === "ticket" && ACTIVE.includes(it.state)) parts.push(el("div", "session muted", it.session));
  c.replaceChildren(...parts);
  return c;
}

function renderBoard() {
  const m = boardModel(snap, mode);
  const nh = (s) => (s === "needs-human" ? " nh" : "");
  const heads = m.heads.map((h) => el("div", `hcell${nh(h.state)}`, el("span", null, h.label), el("span", "num", String(h.count))));
  const cells = (row) => row.cells.map((c) => el("div", `cell${nh(c.state)}`, ...c.items.map(cardNode)));
  flip(() => document.querySelectorAll(".card"), () => {
    const seen = new Set(m.rows.flatMap((r) => r.cells.flatMap((c) => c.items.map((i) => i.id))));
    for (const id of cards.keys()) if (!seen.has(id)) cards.delete(id);
    const board = mode === "lanes"
      ? el("div", "board lanes", el("div", "hcell", "Epic"), ...heads, ...m.rows.flatMap((r) => [
        el("div", "lane-name", el("strong", null, r.epic?.title ?? "No epic"),
          el("span", "small muted", r.epic ? `${r.epic.id} · ${r.epic.done} / ${r.epic.total} merged` : `${r.cells.reduce((n, c) => n + c.items.length, 0)} items`),
          r.epic ? fill(r.epic.total ? (100 * r.epic.done) / r.epic.total : 0) : null),
        ...cells(r)]))
      : el("div", "board kanban", ...heads, ...cells(m.rows[0]));
    $("boardwrap").replaceChildren(board);
  });
}

const rows = new Map();
function renderTokens() {
  const max = Math.max(1, ...snap.topRuns.map((r) => r.tokens ?? 0));
  flip(() => $("tok").children, () => {
    const keep = new Set(snap.topRuns.map((r) => r.run));
    for (const id of rows.keys()) if (!keep.has(id)) rows.delete(id);
    const ordered = snap.topRuns.map((r, i) => {
      let li = rows.get(r.run);
      if (!li) { li = el("li"); rows.set(r.run, li); }
      li.replaceChildren(el("span", "muted num", `${i + 1}`), el("span", null, el("span", "session", r.session), r.model ? el("span", "muted small", ` ${r.model}`) : null),
        el("span", "num", kfmt(r.tokens)), fill((100 * (r.tokens ?? 0)) / max));
      li.title = fmt(r.tokens);
      return li;
    });
    $("tok").replaceChildren(...(ordered.length ? ordered : [el("li", "muted", "No runs yet.")]));
  });
}

// Redrawn every second as well as on each change: a light goes stale with no event at all.
function drawLight() {
  const v = lightView(snap?.light ?? null, Date.now());
  $("band").className = `band lw-${v.word}`;
  $("lamp").className = "lamp" + (v.stale ? " stale" : "");
  setText("lword", v.label);
  setText("lreason", v.reason);
  setText("lsep", v.reason ? " — " : "");
  setText("lmeaning", v.meaning);
  setText("lcount", v.resume);
  $("lcount").title = v.resume ? `at ${new Date(snap.light.resume_at).toLocaleTimeString()}` : "";
  setText("lage", v.age || "No light yet");
}
setInterval(drawLight, 1000);

function meter(id, w) {
  $(id).textContent = w ? `${w.pct}%` : "–";
  $(id + "bar").firstChild.style.width = `${w?.pct ?? 0}%`;
}

function render(s) {
  snap = s;
  drawLight();
  setText("lslots", slotsLine(s));
  setText("total", fmt(s.totalTokens));
  setText("frun", s.factoryRun ? ` · factory run ${s.factoryRun.id}` : "");
  setText("ghnote", s.github?.ok === false ? `GitHub unavailable (${s.github.error}); showing the last state` : "");
  meter("u5", s.light?.five_hour);
  meter("uw", s.light?.weekly);
  $("epics").replaceChildren(...(s.epics.length ? s.epics.map((e) =>
    el("div", "meter", el("div", "row", el("span", null, e.title), el("span", "num muted", `${e.done} / ${e.total} merged`)), fill(e.total ? (100 * e.done) / e.total : 0)))
    : [el("p", "muted", "No epics yet.")]));
  const f = s.factoryRun, r = s.lastEndedRun;
  const last = r ? el("div", null, el("p", "muted", `Last run ${r.id} ended ${ago(r.ended_at)} ago`),
    el("ul", null, ...(r.retros.length ? r.retros.map((x) => { const h = safeHref(x.href); return el("li", null, h ? link(x.title, h) : x.title); }) : [el("li", "muted", "No retros.")])))
    : el("p", "muted", "No run has ended yet.");
  $("retros").replaceChildren(
    el("p", null, f ? `Factory run ${f.id} in progress` + (f.started_at ? `, started ${ago(f.started_at)} ago` : "") : "No factory run in progress."), last);
  renderBoard();
  renderTokens();
}

const es = new EventSource("/api/stream");
es.onmessage = (m) => render(JSON.parse(m.data));
es.onopen = () => { $("conn").textContent = "live"; $("dot").classList.add("live"); };
es.onerror = () => { $("conn").textContent = "reconnecting"; $("dot").classList.remove("live"); };
</script>
</body>
</html>
