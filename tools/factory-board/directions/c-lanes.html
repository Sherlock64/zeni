<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Direction C: swimlanes by epic</title>
<link rel="stylesheet" href="proto.css">
<style>
/* C: one lane per epic across the states; status in a right rail. */
.wrap { max-width: 1800px; margin: 0 auto; padding: 16px; display: grid; grid-template-columns: 1fr 320px; gap: 16px; align-items: start; }
.top { grid-column: 1 / -1; display: flex; align-items: baseline; gap: 16px; }
.top nav { margin-left: auto; }
.lanes { display: grid; grid-template-columns: 170px repeat(var(--cols), minmax(0, 1fr)); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.lanes > * { border-bottom: 1px solid var(--line); padding: 8px; min-width: 0; }
.lanes .hcell { font-size: .72rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; background: var(--sub); display: flex; justify-content: space-between; }
.lanes .hcell.nh { color: var(--warn); }
.lane-name { background: var(--sub); }
.lane-name strong { display: block; }
.lane-name .bar { margin-top: 6px; }
.cell { display: grid; gap: 6px; align-content: start; border-left: 1px solid var(--line); }
.cell.nh:not(:empty) { background: var(--warn-bg); }
.cell.collapsed { padding: 0; }
.card { border: 1px solid var(--line); border-radius: 6px; padding: 5px 7px; font-size: .88rem; background: var(--panel); }
.card .meta { display: flex; gap: 6px; font-size: .7rem; color: var(--muted); }
.card .kind { text-transform: uppercase; letter-spacing: .04em; }
.card.nhc { border-color: var(--warn-line); }
.card.k-epic { display: none; }
.rail { display: grid; gap: 12px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; }
.lightp { border-left: 6px solid var(--lc); }
.lightp .w { display: flex; align-items: center; gap: 8px; font-size: 1.3rem; font-weight: 700; text-transform: uppercase; color: var(--lc); }
.lightp p { margin: 4px 0; }
.nh { background: var(--warn-bg); border-color: var(--warn-line); } .nh h2 { color: var(--warn); }
.runs { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.runs li { display: grid; grid-template-columns: 1.4em 1fr auto; gap: 2px 8px; font-size: .85rem; }
.runs .bar { grid-column: 2 / -1; height: 4px; margin: 0; }
.lastrun p { margin: 0 0 6px; }
.mlane { display: none; }
@media (max-width: 900px) {
  .wrap { grid-template-columns: 1fr; padding: 12px; }
  .lanes { display: none; }
  .mlane { display: block; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; }
  .mlane ul { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 6px; }
  .mlane li { display: grid; grid-template-columns: 1fr auto; gap: 0 8px; }
  .mlane li .st { font-size: .72rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .mlane li.nhc .st { color: var(--warn); font-weight: 700; }
  .rail { order: -1; } .top { order: -2; }
}
</style>
</head>
<body>
<div class="wrap" id="wrap"></div>
<script src="proto.js"></script>
<script>
function topBar() {
  return el("div", "top", el("h1", null, "Zeni factory"), el("span", "muted small", `live · ${fmt(DATA.totalTokens)} weighted tokens`),
    el("nav", null, location.hash === "#p2" ? link("← Board", "#") : link("Flow and cost →", "#p2")));
}
function rail() {
  const v = lightView();
  return el("aside", "rail",
    el("section", `panel lightp lw-${v.word}`, el("div", "w", el("span", `lamp${v.stale ? " stale" : ""}`), v.label),
      el("p", null, el("strong", null, v.reason), " — ", v.meaning, v.resume ? el("strong", "num", ` ${v.resume}`) : null),
      el("p", "small", slotsText(v)), el("p", "small", sessionsLine()), el("p", "small muted", v.age), meters()),
    el("section", `panel${DATA.needsHuman.length ? " nh" : ""}`, el("h2", null, "Needs you"), nhList()),
    el("section", "panel", el("h2", null, "Factory run"), lastRun()),
    el("section", "panel", el("h2", null, "Top 10 token users"), runsList()));
}
function p1() {
  const lanes = [...DATA.epics.map((e) => ({ name: e.title, num: e.number, e, items: DATA.items.filter((i) => i.epic === e.id) })),
    { name: "No epic", items: DATA.items.filter((i) => !i.epic && i.kind !== "epic") }].filter((l) => l.items.length);
  const used = STATES.filter((s) => DATA.items.some((i) => i.state === s && i.kind !== "epic"));
  const grid = el("div", "lanes", el("div", "hcell", "Epic"), ...used.map((s) => el("div", `hcell${s === "needs-human" ? " nh" : ""}`, el("span", null, LABEL[s] ?? s), el("span", "num", byState(s).filter((i) => i.kind !== "epic").length))));
  grid.style.setProperty("--cols", used.length);
  const mob = [];
  for (const l of lanes) {
    const prog = l.e ? (() => { const i = el("i"); i.style.width = `${(100 * l.e.done) / l.e.total}%`; return el("div", "bar", i); })() : null;
    grid.append(el("div", "lane-name", el("strong", null, l.name), el("span", "small muted", l.e ? `#${l.num} · ${l.e.done} / ${l.e.total} merged` : ""), prog));
    for (const s of used) grid.append(el("div", `cell${s === "needs-human" ? " nh" : ""}`, ...l.items.filter((i) => i.state === s).map((i) => card(i))));
    mob.push(el("section", "mlane", el("strong", null, l.name), " ", el("span", "small muted", l.e ? `${l.e.done} / ${l.e.total} merged` : ""), prog?.cloneNode(true),
      el("ul", null, ...l.items.filter((i) => i.kind !== "epic").sort((a, b) => STATES.indexOf(b.state) - STATES.indexOf(a.state))
        .map((i) => el("li", i.state === "needs-human" ? "nhc" : null, el("span", null, el("span", "muted num small", `#${i.number} `), i.title), el("span", "st", LABEL[i.state] ?? i.state))))));
  }
  const emptyNote = el("p", "small muted", `Empty states hidden: ${STATES.filter((s) => !used.includes(s)).map((s) => LABEL[s] ?? s).join(", ")}.`);
  $("wrap").replaceChildren(topBar(), el("main", null, grid, ...mob, emptyNote), rail());
}
function p2() { $("wrap").replaceChildren(topBar(), page2(), rail()); }
route(p1, p2);
</script>
</body>
</html>
